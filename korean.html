<script>
  // ★ 본인이 발급받은 Google Apps Script URL로 교체하세요.
  const SYNC_SERVER_URL = "https://script.google.com/macros/s/AKfycbzf5zZG53ArO38Y9pYUQi4uBTLCvf8x1qLH5_CHSJRMXabslHh17XbnYo8xxE6ntPZR/exec";

  // 1. 클라우드에서 최신 데이터 가져와 로컬스토리지에 자동 적용
  async function syncLoadFromCloud() {
    try {
      const response = await fetch(SYNC_SERVER_URL);
      const cloudData = await response.json();
      if (cloudData && typeof cloudData === 'object') {
        for (const [key, value] of Object.entries(cloudData)) {
          localStorage.setItem(key, typeof value === 'object' ? JSON.stringify(value) : value);
        }
        console.log("☁️ 구글 클라우드 데이터 동기화 완료!");
      }
    } catch (err) {
      console.error("불러오기 실패:", err);
    }
  }

  // 2. 현재 저장된 데이터를 구글 클라우드로 자동 전송
  async function syncSaveToCloud() {
    try {
      const localData = {};
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        localData[key] = localStorage.getItem(key);
      }
      await fetch(SYNC_SERVER_URL, {
        method: "POST",
        body: JSON.stringify(localData)
      });
      console.log("☁️ 구글 클라우드 자동 저장 완료!");
    } catch (err) {
      console.error("저장 실패:", err);
    }
  }

  // 페이지 열릴 때 최신 클라우드 데이터 자동 동기화
  window.addEventListener('DOMContentLoaded', async () => {
    await syncLoadFromCloud();
  });

  // 로컬스토리지 저장 함수 가로채기 (기존 코드를 수정할 필요 없이 자동 감지)
  const originalSetItem = localStorage.setItem;
  localStorage.setItem = function(key, value) {
    originalSetItem.apply(this, arguments);
    syncSaveToCloud(); // 저장 이벤트 발생 시 클라우드로 자동 백업
  };
</script>

  function loadAndInjectRestoredNotes() {
    const keys = ['saegibun_notes_v3', 'saegibun_notes_v2', 'saegibun_notes_v1', 'saegibun_notes', 'notes'];
    let consolidatedNotes = [];

    keys.forEach(key => {
      const rawData = localStorage.getItem(key);
      if (rawData) {
        try {
          const parsed = JSON.parse(rawData);
          if (Array.isArray(parsed)) {
            parsed.forEach(item => {
              if (!consolidatedNotes.some(n => n.id === item.id)) {
                consolidatedNotes.push(item);
              }
            });
          }
        } catch (e) {}
      }
    });

    const allRestored = [...restoredAbsoluteData, ...restoredReadingData, ...restoredLiteratureData];
    allRestored.forEach(seedItem => {
      if (!consolidatedNotes.some(n => n.content === seedItem.content)) {
        consolidatedNotes.push(seedItem);
      }
    });

    localStorage.setItem('saegibun_notes_v3', JSON.stringify(consolidatedNotes));
    return consolidatedNotes;
  }

  function parseYear(val) {
    if (!val) return '복구년도';
    let cleaned = val.trim().replace(/[^0-9]/g, '');
    if (!cleaned) return val;
    if (cleaned.length === 2) {
      let num = parseInt(cleaned, 10);
      return (num <= 50 ? `20${cleaned}` : `19${cleaned}`) + '년';
    } else if (cleaned.length === 4) {
      return cleaned + '년';
    }
    return val.includes('년') ? val : val + '년';
  }

  function formatYearInput(input) {
    if (input.value) {
      input.value = parseYear(input.value);
    }
  }

  function parseMonth(val) {
    if (!val) return '';
    let cleaned = val.trim();
    if (!cleaned) return '';
    if (cleaned === '6') return '6월';
    if (cleaned === '9') return '9월';
    if (cleaned === '11') return '11월(수능)';
    if (/^\d+$/.test(cleaned)) return cleaned + '월';
    return cleaned;
  }

  function formatMonthInput(input) {
    if (input.value) {
      input.value = parseMonth(input.value);
    }
  }

  document.getElementById('noteForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const category = document.getElementById('examCategory').value;

    const year = parseYear(rawYear);

    const rawMonth = document.getElementById('monthDetail').value;
    const monthDetail = parseMonth(rawMonth);
    
    let passageTitle = document.getElementById('passageTitle').value;
    if (isQuickMode && !passageTitle.trim()) {
      const count = notes.length + 1;
      passageTitle = `복구 항목 #${count}`;
    }

    const content = document.getElementById('noteContent').value;
    const litGenre = currentSubject === 'literature' ? document.getElementById('litGenre').value : '';

    if (editingId) {
      notes = notes.map(n => n.id === editingId ? {
        ...n, category, year, monthDetail, passageTitle, content, litGenre, updatedAt: new Date().toLocaleDateString()
      } : n);
      cancelEdit();
    } else {
      const newNote = {
        id: Date.now(),
        subject: currentSubject,
        category,
        year,
        monthDetail,
        litGenre,
        passageTitle,
        content,
        createdAt: new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' })
      };
      notes.unshift(newNote);
    }

    saveAndRender();

    if (isQuickMode) {
      document.getElementById('noteContent').value = '';
      document.getElementById('passageTitle').value = '';
      document.getElementById('noteContent').focus();
    } else {
      this.reset();
    }
  });

  function cancelEdit() {
    editingId = null;
    document.getElementById('submitBtn').textContent = '💾 오답 노트 추가하기';
    document.getElementById('noteForm').reset();
  }

  function saveAndRender() {
    localStorage.setItem('saegibun_notes_v3', JSON.stringify(notes));
    renderNotes();
  }

  // 순서 변경 (위로 이동)
  function moveNoteUp(id) {
    const subjectNotes = notes.filter(n => (n.subject || 'reading') === currentSubject);
    const indexInSubject = subjectNotes.findIndex(n => n.id === id);

    if (indexInSubject > 0) {
      const itemCurrent = subjectNotes[indexInSubject];
      const itemAbove = subjectNotes[indexInSubject - 1];

      const realIdx1 = notes.findIndex(n => n.id === itemCurrent.id);
      const realIdx2 = notes.findIndex(n => n.id === itemAbove.id);

      // 배열 순서 교체
      const temp = notes[realIdx1];
      notes[realIdx1] = notes[realIdx2];
      notes[realIdx2] = temp;

      saveAndRender();
    }
  }

  // 순서 변경 (아래로 이동)
  function moveNoteDown(id) {
    const subjectNotes = notes.filter(n => (n.subject || 'reading') === currentSubject);
    const indexInSubject = subjectNotes.findIndex(n => n.id === id);

    if (indexInSubject >= 0 && indexInSubject < subjectNotes.length - 1) {
      const itemCurrent = subjectNotes[indexInSubject];
      const itemBelow = subjectNotes[indexInSubject + 1];

      const realIdx1 = notes.findIndex(n => n.id === itemCurrent.id);
      const realIdx2 = notes.findIndex(n => n.id === itemBelow.id);

      // 배열 순서 교체
      const temp = notes[realIdx1];
      notes[realIdx1] = notes[realIdx2];
      notes[realIdx2] = temp;

      saveAndRender();
    }
  }

  function renderNotes() {
    const listEl = document.getElementById('notesList');
    const searchVal = document.getElementById('searchInput').value.toLowerCase();
    const filterCat = document.getElementById('filterCategory').value;
    const filterGenre = document.getElementById('filterGenre').value;

    const filtered = notes.filter(n => {
      const matchesSubject = (n.subject || 'reading') === currentSubject;
      const matchesCat = filterCat === 'ALL' || n.category === filterCat;
      const matchesGenre = currentSubject !== 'literature' || filterGenre === 'ALL' || n.litGenre === filterGenre;
      
      const searchTargets = [
        n.passageTitle, n.content, n.year, n.monthDetail, n.litGenre
      ].filter(Boolean).join(' ').toLowerCase();

      const matchesSearch = searchTargets.includes(searchVal);
      return matchesSubject && matchesCat && matchesGenre && matchesSearch;
    });

    let subjectText = '절대강령';
    if (currentSubject === 'reading') subjectText = '독서';
    if (currentSubject === 'literature') subjectText = '문학';

    if (filtered.length === 0) {
      listEl.innerHTML = `
        <div class="empty-state">
          <p>📋 저장된 [${subjectText}] 오답 및 행동강령 노트가 없습니다.</p>
          <p style="font-size:0.8rem; margin-top:0.3rem;">좌측 입력 양식을 작성해 나만의 약점 정리집을 만들어보세요.</p>
        </div>`;
      return;
    }

    listEl.innerHTML = filtered.map((n, idx) => {
      const dateText = n.monthDetail ? `${n.year} ${n.monthDetail}` : n.year;
      const genreBadge = n.litGenre ? `<span class="badge badge-genre">${n.litGenre}</span>` : '';

      return `
        <div class="note-card">
          <div class="note-header">
            <div>
              <div class="note-badges">
                <span class="badge badge-category">${n.category}</span>
                ${genreBadge}
                <span class="badge badge-year">${dateText}</span>
              </div>
              <div class="note-title">${escapeHtml(n.passageTitle)}</div>
            </div>
          </div>
          <div class="note-body">${escapeHtml(n.content)}</div>
          <div class="note-footer">
            <span>작성일: ${n.createdAt}</span>
            <div class="note-actions">
              <button class="btn" style="padding: 0.2rem 0.4rem; font-size: 0.75rem;" onclick="moveNoteUp(${n.id})" title="위로 이동">▲ 위로</button>
              <button class="btn" style="padding: 0.2rem 0.4rem; font-size: 0.75rem;" onclick="moveNoteDown(${n.id})" title="아래로 이동">▼ 아래로</button>
              <button class="btn" style="padding: 0.2rem 0.5rem; font-size: 0.75rem;" onclick="editNote(${n.id})">수정</button>
              <button class="btn btn-danger" style="padding: 0.2rem 0.5rem; font-size: 0.75rem;" onclick="deleteNote(${n.id})">삭제</button>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function deleteNote(id) {
    if (confirm('이 기록을 삭제하시겠습니까?')) {
      notes = notes.filter(n => n.id !== id);
      saveAndRender();
    }
  }

  function editNote(id) {
    const note = notes.find(n => n.id === id);
    if (!note) return;

    document.getElementById('examCategory').value = note.category;
    document.getElementById('yearInput').value = note.year;
    document.getElementById('monthDetail').value = note.monthDetail || '';
    document.getElementById('passageTitle').value = note.passageTitle;
    document.getElementById('noteContent').value = note.content;
    if (note.litGenre && document.getElementById('litGenre')) {
      document.getElementById('litGenre').value = note.litGenre;
    }

    editingId = id;
    document.getElementById('submitBtn').textContent = '✏️ 수정 내용 저장하기';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#039;");
  }

  /* 절대강령 -> 독서 -> 문학 순서로 3단계 페이지 나눔 내보내기 함수 */
  function exportToWord() {
    const absoluteNotes = notes.filter(n => (n.subject || 'reading') === 'absolute');
    const readingNotes = notes.filter(n => (n.subject || 'reading') === 'reading');
    const literatureNotes = notes.filter(n => (n.subject || 'reading') === 'literature');

    if (absoluteNotes.length === 0 && readingNotes.length === 0 && literatureNotes.length === 0) {
      alert('내보낼 오답 노트 내용이 없습니다.');
      return;
    }

    let htmlContent = `
      <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
      <head><meta charset='utf-8'><title>새기분 국어 통합 파이널 행동강령</title>
      <style>
        body { font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; line-height: 1.8; color: #111; padding: 25px; }
        h1.main-title { color: #0f172a; font-size: 20pt; border-bottom: 3px solid #0f172a; padding-bottom: 8px; margin-bottom: 10px; }
        .intro { font-size: 10pt; color: #666; margin-bottom: 30px; }
        
        h2.subject-title-absolute { color: #dc2626; font-size: 15pt; margin-top: 25px; margin-bottom: 12px; border-bottom: 2px solid #dc2626; padding-bottom: 5px; }
        h2.subject-title-reading { color: #1e40af; font-size: 15pt; margin-top: 25px; margin-bottom: 12px; border-bottom: 2px solid #1e40af; padding-bottom: 5px; }
        h2.subject-title-literature { color: #7c3aed; font-size: 15pt; margin-top: 25px; margin-bottom: 12px; border-bottom: 2px solid #7c3aed; padding-bottom: 5px; }
        
        .page-break { page-break-before: always; mso-break-type: page-break; }
        
        h3.genre-title { color: #6d28d9; font-size: 12pt; margin-top: 18px; margin-bottom: 8px; border-left: 4px solid #7c3aed; padding-left: 8px; }
        ol { padding-left: 20px; margin-bottom: 20px; }
        li { margin-bottom: 10px; font-size: 11pt; line-height: 1.7; white-space: pre-wrap; background: #f8fafc; padding: 10px 14px; border-left: 3px solid #cbd5e1; list-style-position: inside; }
      </style>
      </head>
      <body>
        <h1 class="main-title">강민철 [새기분] 국어 통합 파이널 행동강령 체크리스트</h1>
        <div class="intro">생성일자: ${new Date().toLocaleDateString()}</div>
    `;

    // 1. 최우선 절대적 행동강령 내보내기 (Page 1)
    if (absoluteNotes.length > 0) {
      htmlContent += `<h2 class="subject-title-absolute">🔥 국어 최우선 절대 행동강령</h2><ol>`;
      absoluteNotes.forEach(item => {
        htmlContent += `<li>${escapeHtml(item.content)}</li>`;
      });
      htmlContent += `</ol>`;
    }

    // 2. 독서 파트 내보내기 (Page 2)
    if (readingNotes.length > 0) {
      if (absoluteNotes.length > 0) {
        htmlContent += `<div class="page-break"></div>`;
      }
      htmlContent += `<h2 class="subject-title-reading">📖 독서 파이널 행동강령</h2><ol>`;
      readingNotes.forEach(item => {
        htmlContent += `<li>${escapeHtml(item.content)}</li>`;
      });
      htmlContent += `</ol>`;
    }

    // 3. 문학 파트 내보내기 (Page 3)
    if (literatureNotes.length > 0) {
      if (absoluteNotes.length > 0 || readingNotes.length > 0) {
        htmlContent += `<div class="page-break"></div>`;
      }
      htmlContent += `<h2 class="subject-title-literature">🌸 문학 파이널 행동강령</h2>`;
      
      const genreOrder = ['현대시', '고전 시가', '현대 소설', '고전 소설', '수필/극/복합'];
      const grouped = {};

      literatureNotes.forEach(n => {
        const genre = n.litGenre || '기타 갈래';
        if (!grouped[genre]) grouped[genre] = [];
        grouped[genre].push(n);
      });

      const allGenres = Array.from(new Set([...genreOrder, ...Object.keys(grouped)]));

      allGenres.forEach(genre => {
        if (grouped[genre] && grouped[genre].length > 0) {
          htmlContent += `<h3 class="genre-title">${escapeHtml(genre)}</h3><ol>`;
          grouped[genre].forEach(item => {
            htmlContent += `<li>${escapeHtml(item.content)}</li>`;
          });
          htmlContent += `</ol>`;
        }
      });
    }

    htmlContent += `
      </body>
      </html>
    `;

    const blob = new Blob(['\ufeff' + htmlContent], { type: 'application/msword' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `새기분_국어통합_파이널_행동강령_${new Date().toISOString().slice(0,10)}.doc`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  // 초기 시작 시 절대강령 탭으로 시작
  switchSubject('absolute');
</script>
</body>
</html>
