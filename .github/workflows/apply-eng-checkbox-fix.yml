name: Apply approved English checkbox fix once
on:
  push:
    branches: [fix/eng-checkbox-toggle]
    paths: ['.github/workflows/apply-eng-checkbox-fix.yml']
permissions:
  contents: write
concurrency:
  group: apply-eng-checkbox-toggle
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/eng-checkbox-toggle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply exactly the approved two-line HTML change
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/eng-checkbox-toggle'
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, subprocess
          p = Path('eng.html')
          data = p.read_bytes()
          def blob(b):
              return hashlib.sha1(b'blob ' + str(len(b)).encode() + b'\0' + b).hexdigest()
          if blob(data) != '32b7877ab387918c4421091601f8a00e641fa8ee':
              raise SystemExit('eng.html changed since approval; nothing overwritten')
          pairs = [
              (b'onclick="event.stopPropagation(); toggleQuestion(${i});"', b'onclick="event.stopPropagation(); toggleQuestion(${i}, this.checked);"'),
              (b'<label for="q-check-${i}" class=', b'<label for="q-check-${i}" onclick="event.stopPropagation()" class=')
          ]
          result = data
          for old, new in pairs:
              if result.count(old) != 1:
                  raise SystemExit('Expected event handler is not unique; nothing overwritten')
              result = result.replace(old, new, 1)
          if blob(result) != '8e65c382caa9a50c15811a9b14661f6f679885fc':
              raise SystemExit('Output differs from the approved two-line fix; nothing overwritten')
          html = result.decode('utf-8')
          js = '\n'.join(re.findall(r'<script\b[^>]*>([\s\S]*?)</script>', html, re.I))
          subprocess.run(['node', '--check'], input=js, text=True, check=True)
          p.write_bytes(result)
          print('Verified and applied only the approved eng.html checkbox/label fix')
          PY
      - name: Commit only the HTML fix and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/eng-checkbox-toggle'
          rm -- .github/workflows/apply-eng-checkbox-fix.yml
          git add -- eng.html .github/workflows/apply-eng-checkbox-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix English checkbox and label click handling'
          git push origin HEAD:refs/heads/fix/eng-checkbox-toggle
