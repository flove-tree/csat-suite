</style></head><body><div id="sky"><canvas id="canvas"></canvas></div><header id="day"></header><div id="universe"><svg id="links"></svg></div><main id="center"><section id="panel"><div id="write"><p id="dateLabel"></p><h1>수능 끝나면, 나는</h1><form id="form"><input id="wish" maxlength="160" required autocomplete="off" placeholder="오늘은 어떤 소원을 별에 담을까?"><button id="submit">별 달기</button></form><p style="font-size:12px;opacity:.6">하루 하나, 오늘의 나에게서 미래의 나에게.</p></div><div id="done" hidden><div id="emblem" aria-hidden="true"></div><h1>오늘의 소원을 별에 담았어</h1><p id="cheer"></p><button id="edit">오늘 소원 수정</button></div><div id="after" hidden><h1>별들을 만나러 갈 시간</h1><p>모아 둔 소원은 구석의 기록 창에서 꺼내볼 수 있어.</p></div></section></main><div id="stage" aria-live="polite">오늘의 소원을 하늘에 걸고 있어</div><div id="whisper"></div><div id="toast" role="status"></div><nav class="corner left"><button id="constellation" title="별자리 켜기 / 끄기" aria-pressed="false">✦</button><button id="music" title="배경음악 켜기 / 끄기" aria-pressed="false">♫</button></nav><nav class="corner right"><button id="openData">기록 ···</button></nav><div id="popup" hidden></div><dialog id="dataDialog"><h2>작은 기록 보관함</h2><button id="openPast" type="button" aria-expanded="false" aria-controls="pastForm">지난 소원 추가</button><form id="pastForm" hidden><small>깜빡하고 놓친 날의 마음도 별로 남겨요. 소원이 없는 과거 날짜에만 추가할 수 있어요.</small><label for="pastDate">소원을 남길 날짜</label><input id="pastDate" type="date" required aria-describedby="pastFeedback"><label for="pastWish">그날의 소원</label><input id="pastWish" maxlength="160" required autocomplete="off" placeholder="그날 남기고 싶었던 소원을 적어 주세요"><p><button id="savePast" type="submit">이 날짜에 별 달기</button><button id="cancelPast" type="button">취소</button></p><p id="pastFeedback" role="status"></p></form><div id="records"></div><p><button id="word">Word 목록</button><button id="backup">백업 저장</button><button id="restore">백업 불러오기</button></p><input id="file" type="file" accept=".json,application/json" hidden><p id="status" role="status"></p><button id="confirmI const today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};let day=today(),data=[],editing=false,phase='idle',showLines=false,flight=null,popupKey=null;const nodes=new Map();let toastTimer;function toast(t){clearTimeout(toastTimer);$('toast').textContent=t;$('toast').style.opacity=1;toastTimer=setTimeout(()=>$('toast').style.opacity=0,3500)}

function sync(){let keep=new Set();data.forEach((w,i)=>{norm(w,i);let k=key(w,i);keep.add(k);let n=nodes.get(k);if(!n){n=document.createElement('button');n.type='button';n.className='astro';n.innerHTML=artwork(w.shape);n.dataset.shape=w.shape;n.onclick=e=>{e.stopPropagation();openWish(k)};$('universe').append(n);nodes.set(k,n)}n.style.setProperty('--c',w.color);n.classList.toggle('completed',!!w.done);n.setAttribute('aria-label',w.date+'의 소원 보기');if(!flight||flight.node!==n)park(n,w)});for(let[k,n]of nodes){if(!keep.has(k)){n.remove();nodes.delete(k)}}links();positionPopup()}
/* Minimum spanning tree connects all stars without date-order zigzags. Existing coordinates never move. */
function links(){let excluded=flight?.key;let ws=data.map((w,i)=>({w,k:key(w,i),p:dest(w)})).filter(x=>x.k!==excluded);let edges=[];if(showLines&&ws.length>1){let used=new Set([0]);while(used.size<ws.length){let best=null;for(let a of used)for(let b=0;b<ws.length;b++)if(!used.has(b)){let d=Math.hypot(ws[a].p.x-ws[b].p.x,ws[a].p.y-ws[b].p.y);if(!best||d<best.d)best={a,b,d}}used.add(best.b);edges.push([ws[best.a],ws[best.b]])}}let old=new Map([...$('links').children].map(n=>[n.dataset.edge,n])),keep=new Set();for(let[a,b]of edges){let ek=[a.k,b.k].sort().join('~');keep.add(ek);let n=old.get(ek);if(!n){n=document.createElementNS(NS,'line');n.dataset.edge=ek;n.style.opacity=0;$('links').append(n);requestAnimationFrame(()=>{if(n.isConnected)n.style.opacity=1})}n.setAttribute('x1',a.p.x);n.setAttribute('y1',a.p.y);n.setAttribute('x2',b.p.x);n.setAttribute('y2',b.p.y)}for(let[ek,n]of old)if(!keep.has(ek))n.remove()}

]);if(flight!==f)return;node.style.opacity=1;node.style.transform=tr(cx,cy);

]);if(flight!==f)return;node.style.transform=tr(p.x,p.y);node.style.opacity=1;

let AC,master,verb,musicOn=false,musicTimer,bellTimer,ci=0,musicBusy=false;const CH=[[130.81,196,246.94,329.63],[110,164.81,196,261.63],[87.31,130.81,164.81,220],[98,146.83,246.94,329.63]],PENT=[523.25,587.33,659.25,783.99,880,1046.5];function impulse(){let n=AC.sampleRate*4,b=AC.createBuffer(2,n,AC.sampleRate);for(let ch=0;ch<2;ch++){let d=b.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3)}return b}function pad(f,t){[-4,4].forEach(det=>{let o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();o.type='triangle';o.frequency.value=f;o.detune.value=det;lp.type='lowpass';lp.frequency.value=700;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+3);g.gain.linearRampToValueAtTime(0,t+10);o.connect(lp);lp.connect(g);g.connect(verb);g.connect(master);o.start(t);o.stop(t+10.5);o.onended=()=>{o.disconnect();lp.disconnect();g.disconnect()}})}function chord(){if(!musicOn)return;CH[ci++%4].forEach(f=>pad(f,AC.currentTime));musicTimer=setTimeout(chord,8000)}function bell(){if(!musicOn)return;let t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),p=AC.createStereoPanner();o.type='sine';o.frequency.value=PENT[Math.floor(Math.random()*PENT.length)];p.pan.value=Math.random()*1.6-.8;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.07,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+4);o.connect(g);g.connect(p);p.connect(verb);p.connect(master);o.start();o.stop(t+4.2);o.onended=()=>{o.disconnect();g.disconnect();p.disconnect()};bellTimer=setTimeout(bell,2500+Math.random()*5000)}$('music').onclick=async()=>{if(musicBusy)return;musicBusy=true;try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0;master.connect(AC.destination);verb=AC.createConvolver();verb.buffer=impulse();let vg=AC.createGain();vg.gain.value=.9;verb.connect(vg);vg.connect(master)}await AC.resume();musicOn=!musicOn;master.gain.cancelScheduledValues(AC.currentTime);master.gain.setValue
