<script>
  // ★ 본인이 발급받은 Google Apps Script URL로 교체하세요.
  const SYNC_SERVER_URL = "https://script.google.com/macros/s/AKfycbzf5zZG53ArO38Y9pYUQi4uBTLCvf8x1qLH5_CHSJRMXabslHh17XbnYo8xxE6ntPZR/exec";

  // 1. 클라우드에서 최신 데이터 가져와 로컬스토리지에 자동 적용
  async function syncLoadFromCloud() {
    try {
      const response = await fetch(SYNC_SERVER_URL);
      const cloudData = await response.json();
      if (cloudData && typeof cloudData === 'object') {
        for (const [key, value] of Object.entries(cloudData)) {
          localStorage.setItem(key, typeof value === 'object' ? JSON.stringify(value) : value);
        }
        console.log("☁️ 구글 클라우드 데이터 동기화 완료!");
      }
    } catch (err) {
      console.error("불러오기 실패:", err);
    }
  }

  // 2. 현재 저장된 데이터를 구글 클라우드로 자동 전송
  async function syncSaveToCloud() {
    try {
      const localData = {};
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        localData[key] = localStorage.getItem(key);
      }
      await fetch(SYNC_SERVER_URL, {
        method: "POST",
        body: JSON.stringify(localData)
      });
      console.log("☁️ 구글 클라우드 자동 저장 완료!");
    } catch (err) {
      console.error("저장 실패:", err);
    }
  }

  // 페이지 열릴 때 최신 클라우드 데이터 자동 동기화
  window.addEventListener('DOMContentLoaded', async () => {
    await syncLoadFromCloud();
  });

  // 로컬스토리지 저장 함수 가로채기 (기존 코드를 수정할 필요 없이 자동 감지)
  const originalSetItem = localStorage.setItem;
  localStorage.setItem = function(key, value) {
    originalSetItem.apply(this, arguments);
    syncSaveToCloud(); // 저장 이벤트 발생 시 클라우드로 자동 백업
  };
</script>

  function loadAndInjectRestoredNotes() {
    const keys = ['samun_notes_v1', 'samun_notes'];
    let consolidatedNotes = [];

    keys.forEach(key => {
      const rawData = localStorage.getItem(key);
      if (rawData) {
        try {
          const parsed = JSON.parse(rawData);
          if (Array.isArray(parsed)) {
            parsed.forEach(item => {
              if (!consolidatedNotes.some(n => n.id === item.id)) {
                consolidatedNotes.push(item);
              }
            });
          }
        } catch (e) {}
      }
    });

    const allRestored = [...restoredSamunAbsoluteData, ...restoredSamunConceptData, ...restoredSamunStatisticsData];
    allRestored.forEach(seedItem => {
      if (!consolidatedNotes.some(n => n.content === seedItem.content)) {
        consolidatedNotes.push(seedItem);
      }
    });

    localStorage.setItem('samun_notes_v1', JSON.stringify(consolidatedNotes));
    return consolidatedNotes;
  }

  // State variables

  let editingId = null;
  let isQuickMode = false;

  const conceptUnits = [

  function updateUnitOptions() {
    const unitSelect = document.getElementById('unitSelect');
    const filterUnit = document.getElementById('filterUnit');

    let currentUnits = [];
    if (currentSubject === 'concept') currentUnits = conceptUnits;
    if (currentSubject === 'statistics') currentUnits = statisticsUnits;

    unitSelect.innerHTML = currentUnits.map(u => `<option value="${u}">${u}</option>`).join('');
    
    filterUnit.innerHTML = `<option value="ALL">단원 전체</option>` + 
      currentUnits.map(u => `<option value="${u}">${u}</option>`).join('');
  }

  function toggleQuickMode() {
    isQuickMode = document.getElementById('quickModeToggle').checked;
    const yearInput = document.getElementById('yearInput');
    const passageTitle = document.getElementById('passageTitle');
    const noteContent = document.getElementById('noteContent');

    if (isQuickMode) {
      yearInput.removeAttribute('required');
      passageTitle.removeAttribute('required');
      yearInput.placeholder = "자동 입력 (생략 가능)";
      passageTitle.placeholder = "자동 입력 (생략 가능)";
      noteContent.focus();
    } else {
      yearInput.setAttribute('required', 'true');
      passageTitle.setAttribute('required', 'true');
      yearInput.placeholder = "예: 25 또는 26";
      if (currentSubject === 'absolute') {
        passageTitle.placeholder = '예: [시험 태도] 모르는 선지 함정 유의';
      } else if (currentSubject === 'concept') {
        passageTitle.placeholder = '예: 실증적 연구 vs 해석적 연구 선지 판단';
      } else {
        passageTitle.placeholder = '예: 부모/자녀 계층 이동 도표 분모 확인';
      }
    }
  }

  function switchSubject(subject) {
    currentSubject = subject;
    document.documentElement.setAttribute('data-subject', subject);

    document.getElementById('tabAbsolute').classList.toggle('active', subject === 'absolute');
    document.getElementById('tabConcept').classList.toggle('active', subject === 'concept');

    const badge = document.getElementById('headerSubjectBadge');

  function parseYear(val) {
    if (!val) return '복구년도';
    let cleaned = val.trim().replace(/[^0-9]/g, '');
    if (!cleaned) return val;
    if (cleaned.length === 2) {
      let num = parseInt(cleaned, 10);
      return (num <= 50 ? `20${cleaned}` : `19${cleaned}`) + '년';
    } else if (cleaned.length === 4) {
      return cleaned + '년';
    }
    return val.includes('년') ? val : val + '년';
  }

  function formatYearInput(input) {
    if (input.value) {
      input.value = parseYear(input.value);
    }
  }

  function parseMonth(val) {
    if (!val) return '';
    let cleaned = val.trim();
    if (!cleaned) return '';
    if (cleaned === '6') return '6월';
    if (cleaned === '9') return '9월';
    if (cleaned === '11') return '11월(수능)';
    if (/^\d+$/.test(cleaned)) return cleaned + '월';
    return cleaned;
  }

  function formatMonthInput(input) {
    if (input.value) {
      input.value = parseMonth(input.value);
    }
  }

  document.getElementById('noteForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const category = document.getElementById('examCategory').value;
    let rawYear = document.getElementById('yearInput').value;
    
    if (isQuickMode && !rawYear.trim()) {
      rawYear = '2026년';
    }
    const year = parseYear(rawYear);

    const rawMonth = document.getElementById('monthDetail').value;
    const monthDetail = parseMonth(rawMonth);
    
    let passageTitle = document.getElementById('passageTitle').value;
    if (isQuickMode && !passageTitle.trim()) {
      const count = notes.length + 1;
      passageTitle = `사탐 복구 항목 #${count}`;
    }

    const content = document.getElementById('noteContent').value;
    const unit = (currentSubject === 'concept' || currentSubject === 'statistics') ? 
      document.getElementById('unitSelect').value : '';

    if (editingId) {
      notes = notes.map(n => n.id === editingId ? {
        ...n, category, year, monthDetail, passageTitle, content, unit, updatedAt: new Date().toLocaleDateString()
      } : n);
      cancelEdit();
    } else {
      const newNote = {
        id: Date.now(),
        subject: currentSubject,
        category,
        year,
        monthDetail,
        unit,
        passageTitle,
        content,
        createdAt: new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' })
      };
      notes.unshift(newNote);
    }

    saveAndRender();

    if (isQuickMode) {
      document.getElementById('noteContent').value = '';
      document.getElementById('passageTitle').value = '';
      document.getElementById('noteContent').focus();
    } else {
      this.reset();
    }
  });

  function cancelEdit() {
    editingId = null;
    document.getElementById('submitBtn').textContent = '💾 오답 노트 추가하기';
    document.getElementById('noteForm').reset();
  }

  function saveAndRender() {
    localStorage.setItem('samun_notes_v1', JSON.stringify(notes));
    renderNotes();
  }

  function moveNoteUp(id) {
    const subjectNotes = notes.filter(n => (n.subject || 'absolute') === currentSubject);
    const indexInSubject = subjectNotes.findIndex(n => n.id === id);

    if (indexInSubject > 0) {
      const itemCurrent = subjectNotes[indexInSubject];
      const itemAbove = subjectNotes[indexInSubject - 1];

      const realIdx1 = notes.findIndex(n => n.id === itemCurrent.id);
      const realIdx2 = notes.findIndex(n => n.id === itemAbove.id);

      const temp = notes[realIdx1];
      notes[realIdx1] = notes[realIdx2];
      notes[realIdx2] = temp;

      saveAndRender();
    }
  }

  function moveNoteDown(id) {
    const subjectNotes = notes.filter(n => (n.subject || 'absolute') === currentSubject);
    const indexInSubject = subjectNotes.findIndex(n => n.id === id);

    if (indexInSubject >= 0 && indexInSubject < subjectNotes.length - 1) {
      const itemCurrent = subjectNotes[indexInSubject];
      const itemBelow = subjectNotes[indexInSubject + 1];

      const realIdx1 = notes.findIndex(n => n.id === itemCurrent.id);
      const realIdx2 = notes.findIndex(n => n.id === itemBelow.id);

      const temp = notes[realIdx1];
      notes[realIdx1] = notes[realIdx2];
      notes[realIdx2] = temp;

      saveAndRender();
    }
  }

  function renderNotes() {
    const listEl = document.getElementById('notesList');
    const searchVal = document.getElementById('searchInput').value.toLowerCase();
    const filterCat = document.getElementById('filterCategory').value;
    const filterUnit = document.getElementById('filterUnit').value;

    const filtered = notes.filter(n => {
      const matchesSubject = (n.subject || 'absolute') === currentSubject;
      const matchesCat = filterCat === 'ALL' || n.category === filterCat;
      const matchesUnit = (currentSubject === 'absolute') || filterUnit === 'ALL' || n.unit === filterUnit;
      
      const searchTargets = [
        n.passageTitle, n.content, n.year, n.monthDetail, n.unit
      ].filter(Boolean).join(' ').toLowerCase();

      const matchesSearch = searchTargets.includes(searchVal);
      return matchesSubject && matchesCat && matchesUnit && matchesSearch;
    });

    let subjectText = '절대강령';
    if (currentSubject === 'concept') subjectText = '개념 & 선지';
    if (currentSubject === 'statistics') subjectText = '도표 & 통계';

    if (filtered.length === 0) {
      listEl.innerHTML = `
        <div class="empty-state">
          <p>📋 저장된 [${subjectText}] 행동강령 노트가 없습니다.</p>
          <p style="font-size:0.8rem; margin-top:0.3rem;">좌측 양식을 작성해 나만의 사회문화 실수 방지 노트를 만들어보세요.</p>
        </div>`;
      return;
    }

    listEl.innerHTML = filtered.map(n => {
      const dateText = n.monthDetail ? `${n.year} ${n.monthDetail}` : n.year;
      const unitBadge = n.unit ? `<span class="badge badge-unit">${n.unit}</span>` : '';

      return `
        <div class="note-card">
          <div class="note-header">
            <div>
              <div class="note-badges">
                <span class="badge badge-category">${n.category}</span>
                ${unitBadge}
                <span class="badge badge-year">${dateText}</span>
              </div>
              <div class="note-title">${escapeHtml(n.passageTitle)}</div>
            </div>
          </div>
          <div class="note-body">${escapeHtml(n.content)}</div>
          <div class="note-footer">
            <span>작성일: ${n.createdAt}</span>
            <div class="note-actions">
              <button class="btn" style="padding: 0.2rem 0.4rem; font-size: 0.75rem;" onclick="moveNoteUp(${n.id})" title="위로 이동">▲ 위로</button>
              <button class="btn" style="padding: 0.2rem 0.4rem; font-size: 0.75rem;" onclick="moveNoteDown(${n.id})" title="아래로 이동">▼ 아래로</button>
              <button class="btn" style="padding: 0.2rem 0.5rem; font-size: 0.75rem;" onclick="editNote(${n.id})">수정</button>
              <button class="btn btn-danger" style="padding: 0.2rem 0.5rem; font-size: 0.75rem;" onclick="deleteNote(${n.id})">삭제</button>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function deleteNote(id) {
    if (confirm('이 기록을 삭제하시겠습니까?')) {
      notes = notes.filter(n => n.id !== id);
      saveAndRender();
    }
  }

  function editNote(id) {
    const note = notes.find(n => n.id === id);
    if (!note) return;

    document.getElementById('examCategory').value = note.category;
    document.getElementById('yearInput').value = note.year;
    document.getElementById('monthDetail').value = note.monthDetail || '';
    document.getElementById('passageTitle').value = note.passageTitle;
    document.getElementById('noteContent').value = note.content;
    if (note.unit && document.getElementById('unitSelect')) {
      document.getElementById('unitSelect').value = note.unit;
    }

    editingId = id;
    document.getElementById('submitBtn').textContent = '✏️ 수정 내용 저장하기';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#039;");
  }

  /* 사회문화 Word 내보내기 함수 (페이지 분리 적용) */
  function exportToWord() {
    const absoluteNotes = notes.filter(n => (n.subject || 'absolute') === 'absolute');
    const conceptNotes = notes.filter(n => (n.subject || 'absolute') === 'concept');
    const statisticsNotes = notes.filter(n => (n.subject || 'absolute') === 'statistics');

    if (absoluteNotes.length === 0 && conceptNotes.length === 0 && statisticsNotes.length === 0) {
      alert('내보낼 오답 노트 내용이 없습니다.');
      return;
    }

    let htmlContent = `
      <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
      <head><meta charset='utf-8'><title>사회문화 통합 파이널 행동강령</title>
      <style>
        body { font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; line-height: 1.8; color: #111; padding: 25px; }

        .intro { font-size: 10pt; color: #666; margin-bottom: 30px; }
        
        h2.subject-title-absolute { color: #dc2626; font-size: 15pt; margin-top: 25px; margin-bottom: 12px; border-bottom: 2px solid #dc2626; padding-bottom: 5px; }
        h2.subject-title-concept { color: #16a34a; font-size: 15pt; margin-top: 25px; margin-bottom: 12px; border-bottom: 2px solid #16a34a; padding-bottom: 5px; }
        h2.subject-title-statistics { color: #0d9488; font-size: 15pt; margin-top: 25px; margin-bottom: 12px; border-bottom: 2px solid #0d9488; padding-bottom: 5px; }
        
        .page-break { page-break-before: always; mso-break-type: page-break; }
        
        h3.unit-title { color: #15803d; font-size: 12pt; margin-top: 18px; margin-bottom: 8px; border-left: 4px solid #16a34a; padding-left: 8px; }
        ol { padding-left: 20px; margin-bottom: 20px; }
        li { margin-bottom: 10px; font-size: 11pt; line-height: 1.7; white-space: pre-wrap; background: #f0fdf4; padding: 10px 14px; border-left: 3px solid #86efac; list-style-position: inside; }
      </style>
      </head>
      <body>
        <h1 class="main-title">사회문화 통합 파이널 행동강령 체크리스트</h1>
        <div class="intro">생성일자: ${new Date().toLocaleDateString()}</div>
    `;

    // 1. 최우선 절대 행동강령
    if (absoluteNotes.length > 0) {
      htmlContent += `<h2 class="subject-title-absolute">🔥 사회문화 최우선 절대 행동강령</h2><ol>`;
      absoluteNotes.forEach(item => {
        htmlContent += `<li>${escapeHtml(item.content)}</li>`;
      });
      htmlContent += `</ol>`;
    }

    // 2. 개념 & 선지 파트
    if (conceptNotes.length > 0) {
      if (absoluteNotes.length > 0) {
        htmlContent += `<div class="page-break"></div>`;
      }
      htmlContent += `<h2 class="subject-title-concept">📚 개념 & 선지 분석 행동강령</h2>`;
      
      const grouped = {};
      conceptNotes.forEach(n => {
        const u = n.unit || '기타 단원';
        if (!grouped[u]) grouped[u] = [];
        grouped[u].push(n);
      });

      const allUnits = Array.from(new Set([...conceptUnits, ...Object.keys(grouped)]));

      allUnits.forEach(u => {
        if (grouped[u] && grouped[u].length > 0) {
          htmlContent += `<h3 class="unit-title">${escapeHtml(u)}</h3><ol>`;
          grouped[u].forEach(item => {
            htmlContent += `<li>${escapeHtml(item.content)}</li>`;
          });
          htmlContent += `</ol>`;
        }
      });
    }

    // 3. 도표 & 통계 파트
    if (statisticsNotes.length > 0) {
      if (absoluteNotes.length > 0 || conceptNotes.length > 0) {
        htmlContent += `<div class="page-break"></div>`;
      }
      htmlContent += `<h2 class="subject-title-statistics">📊 도표 & 통계 풀이 행동강령</h2>`;
      
      const grouped = {};
      statisticsNotes.forEach(n => {
        const u = n.unit || '기타 도표';
        if (!grouped[u]) grouped[u] = [];
        grouped[u].push(n);
      });

      const allUnits = Array.from(new Set([...statisticsUnits, ...Object.keys(grouped)]));

      allUnits.forEach(u => {
        if (grouped[u] && grouped[u].length > 0) {
          htmlContent += `<h3 class="unit-title">${escapeHtml(u)}</h3><ol>`;
          grouped[u].forEach(item => {
            htmlContent += `<li>${escapeHtml(item.content)}</li>`;
          });
          htmlContent += `</ol>`;
        }
      });
    }

    htmlContent += `
      </body>
      </html>
    `;

    const blob = new Blob(['\ufeff' + htmlContent], { type: 'application/msword' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `사회문화_통합_파이널_행동강령_${new Date().toISOString().slice(0,10)}.doc`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  // 초기 시작 시 절대강령 탭으로 시작
  switchSubject('absolute');
</script>
</body>
</html>
